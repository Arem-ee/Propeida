<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" role="img" aria-label="Propeida logo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#1E3FAE"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0B1F6B" flood-opacity="0.25"/>
    </filter>
    <clipPath id="frame">
      <rect width="640" height="640"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <!-- Background -->
    <rect width="640" height="640" fill="url(#bg)"/>

    <!-- Soft decorative circles -->
    <circle cx="560" cy="75" r="175" fill="#FFFFFF" fill-opacity="0.08"/>
    <circle cx="15" cy="625" r="170" fill="#FFFFFF" fill-opacity="0.08"/>

    <!-- Bowl shape -->
    <path filter="url(#shadow)" fill="#FFFFFF"
      d="M179 200 H462 Q474 200 474 212 V285
         C474 350 430 395 370 395 H271
         C211 395 167 350 167 285 V212
         Q167 200 179 200 Z"/>

    <!-- Letter P -->
    <path fill="#2563EB" fill-rule="evenodd"
      d="M291 250 H328 C348 250 358 264 358 281
         C358 298 348 312 328 312 H304 V348 H291 Z
         M304 262 V300 H327 C339 300 345 292 345 281
         C345 270 339 262 327 262 Z"/>

    <!-- Base line -->
    <rect x="138" y="410" width="368" height="14" rx="7" fill="#FFFFFF" fill-opacity="0.7"/>
  </g>
</svg>
